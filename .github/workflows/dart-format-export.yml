name: Temporary Dart format export

on:
  pull_request:

permissions:
  contents: read

jobs:
  dart-format-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Format reviewed Dart files
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format \
            lib/features/account/presentation/account_screen.dart \
            lib/features/home/presentation/home_screen.dart \
            lib/features/recovery/presentation/mobile_command_recovery_screen.dart \
            lib/features/validation/presentation/validation_center_screen.dart
          git diff --binary -- \
            lib/features/account/presentation/account_screen.dart \
            lib/features/home/presentation/home_screen.dart \
            lib/features/recovery/presentation/mobile_command_recovery_screen.dart \
            lib/features/validation/presentation/validation_center_screen.dart \
            > ../dart-format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dart-format-patch
          path: dart-format.patch
          if-no-files-found: error
          retention-days: 1
