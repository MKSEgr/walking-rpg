name: Fix stale roadmap backend tests

on:
  push:
    branches:
      - batch/roadmap-completion

permissions:
  contents: write

concurrency:
  group: fix-roadmap-stale-tests
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: batch/roadmap-completion
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Align tests with chapter-1 content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend/src/test/java/com/walkingrpg/backend/home/application/HomeServiceTest.java'): [
                  ('assertEquals("starter-v2", snapshot.contentVersion());',
                   'assertEquals(StarterExpeditionContent.CONTENT_VERSION, snapshot.contentVersion());'),
              ],
              Path('backend/src/test/java/com/walkingrpg/backend/home/application/DemoHomeServiceTest.java'): [
                  ('assertEquals("starter-v2", snapshot.contentVersion());',
                   'assertEquals(StarterExpeditionContent.CONTENT_VERSION, snapshot.contentVersion());'),
              ],
              Path('backend/src/test/java/com/walkingrpg/backend/home/api/HomeControllerTest.java'): [
                  ('.andExpect(jsonPath("$.contentVersion").value("starter-v2"))',
                   '.andExpect(jsonPath("$.contentVersion")\n                        .value(StarterExpeditionContent.CONTENT_VERSION))'),
              ],
              Path('backend/src/test/java/com/walkingrpg/backend/expedition/application/EventResolutionServiceTest.java'): [
                  ('void shouldResolveSecondEventAndPersistMaterialOnce() {',
                   'void shouldResolveSecondEventPersistMaterialAndContinueToThirdNode() {'),
                  ('        EventResolutionResult replayed = service.resolve(command);\n\n        assertSame(first, replayed);\n        assertEquals(ExpeditionProgressStatus.COMPLETED, first.expeditionStatus());',
                   '        EventResolutionResult replayed = service.resolve(command);\n        ExpeditionProgressState state = expeditionRepository.findState(\n                "user-1",\n                StarterExpeditionContent.EXPEDITION_ID\n        ).orElseThrow();\n\n        assertSame(first, replayed);\n        assertEquals(ExpeditionProgressStatus.IN_PROGRESS, first.expeditionStatus());'),
                  ('        assertEquals(2, inventoryRepository.findAll("user-1").getFirst().quantity());\n',
                   '        assertEquals(2, inventoryRepository.findAll("user-1").getFirst().quantity());\n        assertEquals(StarterExpeditionContent.THIRD_NODE_ID, state.currentNodeId());\n        assertEquals(55, state.requiredEnergy());\n        assertEquals(0, state.progressEnergy());\n'),
              ],
              Path('backend/src/test/java/com/walkingrpg/backend/expedition/api/EventResolutionControllerTest.java'): [
                  ('.andExpect(jsonPath("$.expeditionStatus").value("COMPLETED"))',
                   '.andExpect(jsonPath("$.expeditionStatus").value("IN_PROGRESS"))'),
              ],
          }

          for path, changes in replacements.items():
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in changes:
                  if old not in updated:
                      raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
                  updated = updated.replace(old, new, 1)
              path.write_text(updated, encoding='utf-8')
          PY
          rm -f .github/workflows/diagnose-roadmap-backend-tests.yml
          rm -f .github/workflows/fix-roadmap-stale-tests.yml
          git diff --check

      - name: Run unit and API tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=DemoHomeServiceTest,HomeQueryFactoryTest,HomeServiceTest,HomeControllerTest,AdaptiveDailyGoalCalculatorTest,DailyGoalServiceTest,ActivitySyncCalculatorTest,ActivitySyncServiceTest,ActivitySyncControllerTest,ActivitySyncFingerprintTest,EconomyServiceTest,ExpeditionAdvanceFingerprintTest,ExpeditionAdvanceServiceTest,ExpeditionAdvanceControllerTest,ProgressionServiceTest,InventoryServiceTest,EventResolutionFingerprintTest,EventResolutionServiceTest,EventResolutionControllerTest \
            test

      - name: Publish test alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test: align first playable assertions with chapter content"
          git push origin HEAD:batch/roadmap-completion
