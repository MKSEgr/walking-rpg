name: Release quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_CANDIDATE_API_BASE_URL: ${{ vars.MOBILE_RELEASE_API_BASE_URL || 'https://api.release-candidate.invalid' }}
  RELEASE_CANDIDATE_OIDC_ISSUER: ${{ vars.MOBILE_RELEASE_OIDC_ISSUER || 'https://identity.release-candidate.invalid/realms/walking-rpg' }}
  RELEASE_CANDIDATE_OIDC_CLIENT_ID: ${{ vars.MOBILE_RELEASE_OIDC_CLIENT_ID || 'walking-rpg-mobile' }}
  RELEASE_CANDIDATE_OIDC_SCOPES: openid profile offline_access walking-rpg.user
  RELEASE_CANDIDATE_OIDC_REDIRECT_URI: com.walkingrpg.app:/oauthredirect
  RELEASE_CANDIDATE_OIDC_POST_LOGOUT_REDIRECT_URI: com.walkingrpg.app:/logout

jobs:
  readiness:
    name: Release quality · policy and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify release readiness
        run: bash scripts/verify-release-readiness.sh

      - name: Generate deterministic build metadata
        env:
          FLUTTER_VERSION: 3.44.7
          JAVA_VERSION: 21
        shell: bash
        run: |
          set -euo pipefail
          export GIT_SHA="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/generate-build-metadata.sh build/release/build-metadata.json
          bash scripts/generate-build-metadata.sh build/release/build-metadata-copy.json
          cmp build/release/build-metadata.json build/release/build-metadata-copy.json
          rm build/release/build-metadata-copy.json
          sha256sum build/release/build-metadata.json > build/release/build-metadata.sha256

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-build-metadata
          path: |
            build/release/build-metadata.json
            build/release/build-metadata.sha256
          if-no-files-found: error
          retention-days: 14

  backend-package:
    name: Release quality · backend package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package executable backend artifact
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Record backend digest
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n1)"
          test -n "$jar"
          sha256sum "$jar" > target/backend-release-candidate.sha256

      - name: Upload backend release candidate
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-candidate
          path: |
            backend/target/*.jar
            backend/target/backend-release-candidate.sha256
          if-no-files-found: error
          retention-days: 14

  backup-restore-drill:
    name: Release quality · synthetic backup/restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run isolated PostgreSQL backup/restore drill
        id: backup-restore-drill
        shell: bash
        run: |
          set -euo pipefail
          chmod +x backend/mvnw scripts/operations/run-synthetic-backup-restore-drill.sh
          output="$RUNNER_TEMP/walking-rpg-backup-restore-$EXPECTED_SOURCE_GIT_SHA"
          receipt="$RUNNER_TEMP/walking-rpg-backup-restore-receipt-$EXPECTED_SOURCE_GIT_SHA"
          bash scripts/operations/run-synthetic-backup-restore-drill.sh \
            "$output" \
            "$EXPECTED_SOURCE_GIT_SHA"
          install -d -m 700 "$receipt"
          install -m 600 \
            "$output/evidence.json" \
            "$output/evidence.json.sha256" \
            "$receipt/"
          python3 scripts/operations/verify-backup-restore-evidence.py \
            receipt \
            "$receipt" \
            "$EXPECTED_SOURCE_GIT_SHA"
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized synthetic evidence
        id: upload-evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-backup-restore-evidence
          path: |
            ${{ steps.backup-restore-drill.outputs.receipt }}/evidence.json
            ${{ steps.backup-restore-drill.outputs.receipt }}/evidence.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record retained artifact provenance
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-evidence.outputs.artifact-digest }}
        run: |
          printf 'Synthetic evidence artifact SHA-256: `%s`\n' \
            "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Tested source commit: `%s`\n' \
            "$EXPECTED_SOURCE_GIT_SHA" >> "$GITHUB_STEP_SUMMARY"

  android-release:
    name: Release quality · Android unsigned AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned release-candidate AAB
        run: |
          flutter build appbundle --release \
            --dart-define=MOBILE_AUTH_MODE=oidc \
            "--dart-define=API_BASE_URL=$RELEASE_CANDIDATE_API_BASE_URL" \
            "--dart-define=OIDC_ISSUER=$RELEASE_CANDIDATE_OIDC_ISSUER" \
            "--dart-define=OIDC_CLIENT_ID=$RELEASE_CANDIDATE_OIDC_CLIENT_ID" \
            "--dart-define=OIDC_SCOPES=$RELEASE_CANDIDATE_OIDC_SCOPES" \
            "--dart-define=OIDC_REDIRECT_URI=$RELEASE_CANDIDATE_OIDC_REDIRECT_URI" \
            "--dart-define=OIDC_POST_LOGOUT_REDIRECT_URI=$RELEASE_CANDIDATE_OIDC_POST_LOGOUT_REDIRECT_URI"

      - name: Verify and digest AAB
        shell: bash
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          sha256sum "$aab" > build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-aab
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14

  ios-release:
    name: Release quality · iOS no-codesign app
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release candidate without signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=MOBILE_AUTH_MODE=oidc \
            "--dart-define=API_BASE_URL=$RELEASE_CANDIDATE_API_BASE_URL" \
            "--dart-define=OIDC_ISSUER=$RELEASE_CANDIDATE_OIDC_ISSUER" \
            "--dart-define=OIDC_CLIENT_ID=$RELEASE_CANDIDATE_OIDC_CLIENT_ID" \
            "--dart-define=OIDC_SCOPES=$RELEASE_CANDIDATE_OIDC_SCOPES" \
            "--dart-define=OIDC_REDIRECT_URI=$RELEASE_CANDIDATE_OIDC_REDIRECT_URI" \
            "--dart-define=OIDC_POST_LOGOUT_REDIRECT_URI=$RELEASE_CANDIDATE_OIDC_POST_LOGOUT_REDIRECT_URI"

      - name: Archive and digest no-codesign app
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios/iphoneos/WalkingRPG-no-codesign.zip
          shasum -a 256 build/ios/iphoneos/WalkingRPG-no-codesign.zip \
            > build/ios/iphoneos/WalkingRPG-no-codesign.zip.sha256

      - name: Upload iOS release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ios-no-codesign-release-app
          path: |
            mobile/build/ios/iphoneos/WalkingRPG-no-codesign.zip
            mobile/build/ios/iphoneos/WalkingRPG-no-codesign.zip.sha256
          if-no-files-found: error
          retention-days: 14
