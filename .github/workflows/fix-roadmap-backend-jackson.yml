name: Fix roadmap backend Jackson 3 migration

on:
  push:
    branches:
      - batch/roadmap-completion

permissions:
  contents: write

concurrency:
  group: fix-roadmap-backend-jackson
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: batch/roadmap-completion
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Migrate Jackson 2 imports to Jackson 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('backend/src/main/java'), Path('backend/src/test/java')]
          replacements = {
              'import com.fasterxml.jackson.core.JsonProcessingException;': 'import tools.jackson.core.JacksonException;',
              'import com.fasterxml.jackson.core.type.TypeReference;': 'import tools.jackson.core.type.TypeReference;',
              'import com.fasterxml.jackson.databind.ObjectMapper;': 'import tools.jackson.databind.ObjectMapper;',
              'JsonProcessingException': 'JacksonException',
          }
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.java'):
                  source = path.read_text(encoding='utf-8')
                  updated = source
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != source:
                      path.write_text(updated, encoding='utf-8')
          PY
          if grep -R "com.fasterxml.jackson\|JsonProcessingException" -n backend/src/main/java backend/src/test/java; then
            echo "Jackson 2 references remain" >&2
            exit 1
          fi
          rm -f .github/workflows/fix-roadmap-backend-jackson.yml
          git diff --check

      - name: Compile backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -DskipTests compile

      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No Jackson migration changes were required"
            exit 0
          fi
          git commit -m "fix: migrate roadmap backend to Jackson 3"
          git push origin HEAD:batch/roadmap-completion
