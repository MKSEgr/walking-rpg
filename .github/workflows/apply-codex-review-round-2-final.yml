name: Finalize second Codex review cache fixes

on:
  push:
    branches:
      - feat/offline-read-cache

permissions:
  contents: write

concurrency:
  group: finalize-codex-review-round-2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: feat/offline-read-cache
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-codex-review-round-2.yml')
          workflow = source.read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/apply_codex_round_2.py').write_text(script + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_codex_round_2.py
          python3 <<'PY'
          from pathlib import Path

          path = Path('mobile/test/cache_consistency_review_test.dart')
          text = path.read_text(encoding='utf-8')
          anchor = "import 'package:walking_rpg_mobile/features/platform/data/platform_api_client.dart';\n"
          addition = anchor + "import 'package:walking_rpg_mobile/features/platform/domain/platform_snapshot.dart';\n"
          if text.count(anchor) != 1:
              raise RuntimeError('PlatformApiClient import anchor was not unique')
          path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          for temporary in (
              '.github/workflows/debug-codex-review-round-2.yml',
              '.github/workflows/apply-codex-review-round-2-final.yml',
          ):
              Path(temporary).unlink(missing_ok=True)
          PY
          dart format mobile/lib mobile/test
          git diff --check

      - name: Verify clean release source tree
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-readiness.sh

      - name: Validate Flutter implementation
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Publish clean fix commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Reviewed fixes produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve cache high-water and owner isolation"
          git push origin HEAD:feat/offline-read-cache
