name: Diagnose roadmap backend tests

on:
  push:
    branches:
      - batch/roadmap-completion

permissions:
  contents: read

concurrency:
  group: diagnose-roadmap-backend-tests
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: batch/roadmap-completion

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit and API tests with captured output
        id: tests
        shell: bash
        run: |
          set +e
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=DemoHomeServiceTest,HomeQueryFactoryTest,HomeServiceTest,HomeControllerTest,AdaptiveDailyGoalCalculatorTest,DailyGoalServiceTest,ActivitySyncCalculatorTest,ActivitySyncServiceTest,ActivitySyncControllerTest,ActivitySyncFingerprintTest,EconomyServiceTest,ExpeditionAdvanceFingerprintTest,ExpeditionAdvanceServiceTest,ExpeditionAdvanceControllerTest,ProgressionServiceTest,InventoryServiceTest,EventResolutionFingerprintTest,EventResolutionServiceTest,EventResolutionControllerTest \
            test > /tmp/roadmap-unit-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-unit-tests-log
          path: /tmp/roadmap-unit-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
