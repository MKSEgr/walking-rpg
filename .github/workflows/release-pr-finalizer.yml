name: Release PR finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-pr-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.event.pull_request.draft == true
    name: Release gate · finalize PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for standard and release checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          required = {
              'Project structure',
              'Backend · Java 21',
              'Mobile · Flutter 3.44.7',
              'Android host · debug APK',
              'iOS host · simulator debug',
              'Release quality · policy and metadata',
              'Release quality · backend package',
              'Release quality · Android unsigned AAB',
              'Release quality · iOS no-codesign app',
          }
          repository = os.environ['REPOSITORY']
          sha = os.environ['CHECK_SHA']

          for attempt in range(90):
              raw = subprocess.check_output([
                  'gh', 'api',
                  f'repos/{repository}/commits/{sha}/check-runs?per_page=100',
              ], text=True)
              runs = json.loads(raw)['check_runs']
              by_name = {run['name']: run for run in runs}
              missing = sorted(required - by_name.keys())
              failed = sorted(
                  name for name in required
                  if name in by_name
                  and by_name[name]['status'] == 'completed'
                  and by_name[name]['conclusion'] not in {'success', 'neutral', 'skipped'}
              )
              if failed:
                  raise SystemExit(f'Required checks failed: {failed}')
              if not missing and all(by_name[name]['status'] == 'completed' for name in required):
                  print('All standard and release checks completed successfully.')
                  break
              print(f'Waiting for checks; missing={missing}, attempt={attempt + 1}/90')
              time.sleep(30)
          else:
              raise SystemExit('Timed out waiting for required checks')
          PY

      - name: Mark pull request ready and add summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Standard CI и Release quality завершились успешно. PR автоматически переведён в Ready for review; production signing и external gates по-прежнему требуют ручного owner approval и evidence."
