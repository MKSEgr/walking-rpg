name: Release PR finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-pr-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.event.pull_request.draft == true
    name: Release gate · finalize PR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Wait for standard and release checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/wait_for_required_checks.py

      - name: Publish release gate summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Standard CI и Release quality завершились успешно. Release gate подтверждён; PR можно переводить в Ready for review подключённым пользователем. Production signing и external gates по-прежнему требуют ручного owner approval и evidence."
