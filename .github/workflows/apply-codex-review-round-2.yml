name: Apply second Codex review cache fixes

on:
  push:
    branches:
      - feat/offline-read-cache

permissions:
  contents: write

concurrency:
  group: apply-codex-review-round-2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: feat/offline-read-cache
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Apply reviewed consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          platform = "mobile/lib/features/platform/data/platform_api_client.dart"
          replace_once(
              platform,
              """  static const Duration cacheTtl = Duration(days: 7);\n  static const String cacheVariant = 'current';\n  static const String _experimentExposureCommand = 'RECORD_EXPERIMENT_EXPOSURE';\n""",
              """  static const Duration cacheTtl = Duration(days: 7);\n  static const String cacheVariant = 'current';\n  static const String _experimentExposureCommand = 'RECORD_EXPERIMENT_EXPOSURE';\n  static final Map<String, int> _stateVersionHighWaterMarks =\n      <String, int>{};\n""",
          )
          replace_once(
              platform,
              """    final int? minimumStateVersion = recordsExposure\n        ? null\n        : await _cachedPlatformStateVersion();\n""",
              """    final int? minimumStateVersion = recordsExposure\n        ? null\n        : await _minimumKnownStateVersion();\n""",
          )
          replace_once(
              platform,
              """        minimumStateVersion: minimumStateVersion,\n      );\n""",
              """        minimumStateVersion: minimumStateVersion,\n        requireKnownBaseline: true,\n      );\n""",
          )
          replace_once(
              platform,
              """        return PlatformSnapshot.fromJson(\n          json,\n          cacheMetadata: CachedReadMetadata(\n            cachedAt: entry.storedAt,\n            reason: reason,\n          ),\n        );\n""",
              """        final PlatformSnapshot snapshot = PlatformSnapshot.fromJson(\n          json,\n          cacheMetadata: CachedReadMetadata(\n            cachedAt: entry.storedAt,\n            reason: reason,\n          ),\n        );\n        final int? highWaterMark = _stateVersionHighWaterMark;\n        if (highWaterMark != null &&\n            snapshot.stateVersion < highWaterMark) {\n          await cache.remove(\n            ownerId: userId,\n            resource: ReadSnapshotResource.platform,\n            variant: cacheVariant,\n          );\n          return null;\n        }\n        _observeStateVersion(snapshot.stateVersion);\n        return snapshot;\n""",
          )
          replace_once(
              platform,
              """  Future<int?> _cachedPlatformStateVersion() async {\n    final ReadSnapshotCache? cache = _cache;\n    if (cache == null) {\n      return null;\n    }\n    return _cachedPlatformStateVersionFrom(cache);\n  }\n""",
              """  Future<int?> _minimumKnownStateVersion() async {\n    final ReadSnapshotCache? cache = _cache;\n    final int? cachedStateVersion = cache == null\n        ? null\n        : await _cachedPlatformStateVersionFrom(cache);\n    final int? highWaterMark = _stateVersionHighWaterMark;\n    if (cachedStateVersion == null) {\n      return highWaterMark;\n    }\n    _observeStateVersion(cachedStateVersion);\n    if (highWaterMark == null || cachedStateVersion > highWaterMark) {\n      return cachedStateVersion;\n    }\n    return highWaterMark;\n  }\n""",
          )
          replace_once(
              platform,
              """        return PlatformSnapshot.fromJson(json).stateVersion;\n""",
              """        final int stateVersion = PlatformSnapshot.fromJson(json).stateVersion;\n        final int? highWaterMark = _stateVersionHighWaterMark;\n        if (highWaterMark != null && stateVersion < highWaterMark) {\n          await cache.remove(\n            ownerId: userId,\n            resource: ReadSnapshotResource.platform,\n            variant: cacheVariant,\n          );\n          return null;\n        }\n        _observeStateVersion(stateVersion);\n        return stateVersion;\n""",
          )
          replace_once(
              platform,
              """    required ReadSnapshotGenerationToken generationToken,\n    int? minimumStateVersion,\n  }) async {\n""",
              """    required ReadSnapshotGenerationToken generationToken,\n    int? minimumStateVersion,\n    bool requireKnownBaseline = false,\n  }) async {\n""",
          )
          replace_once(
              platform,
              """      int requiredStateVersion = minimumStateVersion ?? -1;\n      if (cachedStateVersion != null &&\n          cachedStateVersion > requiredStateVersion) {\n        requiredStateVersion = cachedStateVersion;\n      }\n      if (stateVersion < requiredStateVersion ||\n          !isReadSnapshotGenerationCurrent(generationToken)) {\n        return;\n      }\n""",
              """      int? requiredStateVersion = minimumStateVersion;\n      final int? highWaterMark = _stateVersionHighWaterMark;\n      if (highWaterMark != null &&\n          (requiredStateVersion == null ||\n              highWaterMark > requiredStateVersion)) {\n        requiredStateVersion = highWaterMark;\n      }\n      if (cachedStateVersion != null &&\n          (requiredStateVersion == null ||\n              cachedStateVersion > requiredStateVersion)) {\n        requiredStateVersion = cachedStateVersion;\n      }\n      if ((requireKnownBaseline && requiredStateVersion == null) ||\n          (requiredStateVersion != null &&\n              stateVersion < requiredStateVersion) ||\n          !isReadSnapshotGenerationCurrent(generationToken)) {\n        return;\n      }\n""",
          )
          replace_once(
              platform,
              """      if (!isReadSnapshotGenerationCurrent(generationToken)) {\n        await _removePayloadIfCurrent(cache: cache, payload: payload);\n      }\n""",
              """      if (!isReadSnapshotGenerationCurrent(generationToken)) {\n        await _removePayloadIfCurrent(cache: cache, payload: payload);\n        return;\n      }\n      _observeStateVersion(stateVersion);\n""",
          )
          replace_once(
              platform,
              """  bool _canUseCache(Object error) {\n""",
              """  String get _stateVersionScopeKey => '${baseUri.origin}|$userId';\n\n  int? get _stateVersionHighWaterMark =>\n      _stateVersionHighWaterMarks[_stateVersionScopeKey];\n\n  void _observeStateVersion(int stateVersion) {\n    final String key = _stateVersionScopeKey;\n    final int? current = _stateVersionHighWaterMarks[key];\n    if (current == null || stateVersion > current) {\n      _stateVersionHighWaterMarks[key] = stateVersion;\n    }\n  }\n\n  bool _canUseCache(Object error) {\n""",
          )

          file_cache = "mobile/lib/core/cache/file_read_snapshot_cache.dart"
          replace_once(
              file_cache,
              """  static const int schemaVersion = 1;\n  static final Map<String, AsyncLock> _pathLocks = <String, AsyncLock>{};\n""",
              """  static const int schemaVersion = 1;\n  static const String _base32Alphabet = 'abcdefghijklmnopqrstuvwxyz234567';\n  static final Map<String, AsyncLock> _pathLocks = <String, AsyncLock>{};\n""",
          )
          replace_once(
              file_cache,
              """    final String encodedOwner = base64Url\n        .encode(utf8.encode(normalizedOwner))\n        .replaceAll('=', '');\n""",
              """    final String encodedOwner = _encodeOwner(normalizedOwner);\n""",
          )
          replace_once(
              file_cache,
              """  String _normalizeOwner(String ownerId) {\n""",
              """  String _encodeOwner(String ownerId) {\n    // Lower-case Base32 remains injective on case-insensitive Apple filesystems\n    // and stays below common filename limits for the supported 128-byte owner.\n    final StringBuffer encoded = StringBuffer();\n    int buffer = 0;\n    int bitsInBuffer = 0;\n    for (final int byte in utf8.encode(ownerId)) {\n      buffer = (buffer << 8) | byte;\n      bitsInBuffer += 8;\n      while (bitsInBuffer >= 5) {\n        bitsInBuffer -= 5;\n        encoded.write(_base32Alphabet[(buffer >> bitsInBuffer) & 0x1f]);\n      }\n      if (bitsInBuffer == 0) {\n        buffer = 0;\n      } else {\n        buffer &= (1 << bitsInBuffer) - 1;\n      }\n    }\n    if (bitsInBuffer > 0) {\n      encoded.write(\n        _base32Alphabet[(buffer << (5 - bitsInBuffer)) & 0x1f],\n      );\n    }\n    return encoded.toString();\n  }\n\n  String _normalizeOwner(String ownerId) {\n""",
          )

          consistency_test = "mobile/test/cache_consistency_review_test.dart"
          replace_once(
              consistency_test,
              """  test('newer authoritative command snapshot is cached', () async {\n""",
              """  test('platform high-water survives snapshot invalidation', () async {\n    const String ownerId = 'review-user-high-water';\n    final InMemoryReadSnapshotCache cache = InMemoryReadSnapshotCache();\n    await _seedPlatform(cache, ownerId: ownerId, stateVersion: 12);\n    final PlatformApiClient observer = PlatformApiClient(\n      baseUri: Uri.parse('http://localhost:8080'),\n      userId: ownerId,\n      transport: const _RetryableGetTransport(),\n      cache: cache,\n    );\n\n    final PlatformSnapshot observed = await observer.fetchSnapshot();\n    expect(observed.stateVersion, 12);\n    await invalidateReadSnapshotsBeforeMutation(cache, ownerId: ownerId);\n    expect(await _readPlatform(cache, ownerId), isNull);\n\n    final PlatformApiClient replay = PlatformApiClient(\n      baseUri: Uri.parse('http://localhost:8080'),\n      userId: ownerId,\n      transport: _CommandTransport(\n        HomeTransportResponse(\n          statusCode: 200,\n          body: jsonEncode(\n            _commandResponse(\n              commandType: 'SELECT_PET',\n              idempotencyKey: 'pet-old-after-invalidation',\n              stateVersion: 4,\n            ),\n          ),\n        ),\n      ),\n      cache: cache,\n    );\n\n    await replay.execute(\n      commandType: 'SELECT_PET',\n      payload: const <String, Object?>{'petId': 'spark-v1'},\n      idempotencyKey: 'pet-old-after-invalidation',\n    );\n\n    expect(await _readPlatform(cache, ownerId), isNull);\n  });\n\n  test('command response without a trusted baseline is not cached', () async {\n    const String ownerId = 'review-user-no-baseline';\n    final InMemoryReadSnapshotCache cache = InMemoryReadSnapshotCache();\n    final PlatformApiClient client = PlatformApiClient(\n      baseUri: Uri.parse('http://localhost:8080'),\n      userId: ownerId,\n      transport: _CommandTransport(\n        HomeTransportResponse(\n          statusCode: 200,\n          body: jsonEncode(\n            _commandResponse(\n              commandType: 'SELECT_PET',\n              idempotencyKey: 'pet-unknown-history',\n              stateVersion: 4,\n            ),\n          ),\n        ),\n      ),\n      cache: cache,\n    );\n\n    await client.execute(\n      commandType: 'SELECT_PET',\n      payload: const <String, Object?>{'petId': 'spark-v1'},\n      idempotencyKey: 'pet-unknown-history',\n    );\n\n    expect(await _readPlatform(cache, ownerId), isNull);\n  });\n\n  test('newer authoritative command snapshot is cached', () async {\n""",
          )
          replace_once(
              consistency_test,
              """final class _PendingGetTransport implements HomeTransport {\n""",
              """final class _RetryableGetTransport implements HomeTransport {\n  const _RetryableGetTransport();\n\n  @override\n  Future<HomeTransportResponse> get({\n    required Uri uri,\n    required Map<String, String> headers,\n  }) async {\n    return const HomeTransportResponse(\n      statusCode: 503,\n      body: '{\"message\":\"temporarily unavailable\"}',\n    );\n  }\n\n  @override\n  Future<HomeTransportResponse> post({\n    required Uri uri,\n    required Map<String, String> headers,\n    required String body,\n  }) {\n    throw UnimplementedError();\n  }\n}\n\nfinal class _PendingGetTransport implements HomeTransport {\n""",
          )

          file_cache_test = "mobile/test/file_read_snapshot_cache_test.dart"
          replace_once(
              file_cache_test,
              """  test(\n    'quarantines a fully corrupted store and accepts a new snapshot',\n""",
              """  test('uses case-insensitive-safe filenames for owners', () async {\n    await cache.write(\n      ownerId: 'aaa',\n      resource: ReadSnapshotResource.home,\n      variant: 'today',\n      payload: jsonEncode(<String, Object?>{'owner': 'aaa'}),\n      ttl: const Duration(days: 1),\n    );\n    await cache.write(\n      ownerId: 'aaG',\n      resource: ReadSnapshotResource.home,\n      variant: 'today',\n      payload: jsonEncode(<String, Object?>{'owner': 'aaG'}),\n      ttl: const Duration(days: 1),\n    );\n\n    final List<File> files = await directory\n        .list()\n        .where(\n          (FileSystemEntity entity) =>\n              entity is File && entity.path.endsWith('.json'),\n        )\n        .cast<File>()\n        .toList();\n    final List<String> names = files\n        .map((File file) => file.uri.pathSegments.last)\n        .toList(growable: false);\n\n    expect(files, hasLength(2));\n    expect(names.every((String name) => name == name.toLowerCase()), isTrue);\n    expect(names.map((String name) => name.toLowerCase()).toSet(), hasLength(2));\n    expect(\n      jsonDecode(\n        (await cache.read(\n          ownerId: 'aaa',\n          resource: ReadSnapshotResource.home,\n          variant: 'today',\n        ))!\n            .payload,\n      ),\n      <String, dynamic>{'owner': 'aaa'},\n    );\n    expect(\n      jsonDecode(\n        (await cache.read(\n          ownerId: 'aaG',\n          resource: ReadSnapshotResource.home,\n          variant: 'today',\n        ))!\n            .payload,\n      ),\n      <String, dynamic>{'owner': 'aaG'},\n    );\n  });\n\n  test(\n    'quarantines a fully corrupted store and accepts a new snapshot',\n""",
          )

          platform_test = "mobile/test/platform_api_client_test.dart"
          replace_once(
              platform_test,
              """      await cache.write(\n        ownerId: 'user-1',\n        resource: ReadSnapshotResource.home,\n        variant: '2026-07-27',\n        payload: '{}',\n        ttl: const Duration(days: 1),\n      );\n      final _FakePlatformTransport transport = _FakePlatformTransport(\n""",
              """      await cache.write(\n        ownerId: 'command-cache-user',\n        resource: ReadSnapshotResource.home,\n        variant: '2026-07-27',\n        payload: '{}',\n        ttl: const Duration(days: 1),\n      );\n      await cache.write(\n        ownerId: 'command-cache-user',\n        resource: ReadSnapshotResource.platform,\n        variant: PlatformApiClient.cacheVariant,\n        payload: jsonEncode(platformSnapshotJson(stateVersion: 2)),\n        ttl: PlatformApiClient.cacheTtl,\n      );\n      final _FakePlatformTransport transport = _FakePlatformTransport(\n""",
          )
          replace_once(
              platform_test,
              """        userId: 'user-1',\n        transport: transport,\n        cache: cache,\n      );\n\n      await client.execute(\n""",
              """        userId: 'command-cache-user',\n        transport: transport,\n        cache: cache,\n      );\n\n      await client.execute(\n""",
          )
          replace_once(
              platform_test,
              """          ownerId: 'user-1',\n          resource: ReadSnapshotResource.home,\n""",
              """          ownerId: 'command-cache-user',\n          resource: ReadSnapshotResource.home,\n""",
          )
          replace_once(
              platform_test,
              """        ownerId: 'user-1',\n        resource: ReadSnapshotResource.platform,\n""",
              """        ownerId: 'command-cache-user',\n        resource: ReadSnapshotResource.platform,\n""",
          )

          Path('.github/workflows/apply-codex-review-round-2.yml').unlink()
          PY

          dart format mobile/lib mobile/test
          git diff --check

      - name: Verify clean release source tree
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-readiness.sh

      - name: Validate Flutter implementation
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Publish clean fix commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Reviewed fixes produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve cache high-water and owner isolation"
          git push origin HEAD:feat/offline-read-cache
