name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-structure:
    name: Project structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository scaffold
        run: bash ./scripts/verify-project.sh

  backend:
    name: Backend · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        id: backend-compile
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress -DskipTests compile > /tmp/backend-compile.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend compile diagnostics
        if: steps.backend-compile.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backend-compile-log
          path: /tmp/backend-compile.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when backend compilation failed
        if: steps.backend-compile.outputs.status != '0'
        run: exit 1

      - name: Compile backend tests
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests test-compile

      - name: Run unit and API tests
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dtest=DemoHomeServiceTest,ActivitySyncCalculatorTest,ActivitySyncServiceTest,ActivitySyncControllerTest,ActivitySyncFingerprintTest
          test

      - name: Run PostgreSQL integration tests
        id: postgres-integration
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress -Dtest=ActivitySyncPersistenceIntegrationTest test > /tmp/postgres-integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload PostgreSQL integration diagnostics
        if: steps.postgres-integration.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-log
          path: /tmp/postgres-integration.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when PostgreSQL integration tests failed
        if: steps.postgres-integration.outputs.status != '0'
        run: exit 1

  mobile:
    name: Mobile · Flutter 3.44.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
