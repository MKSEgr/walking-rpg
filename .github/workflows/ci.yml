name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-structure:
    name: Project structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository scaffold
        run: bash ./scripts/verify-project.sh

  backend:
    name: Backend · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        id: backend-compile
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress -DskipTests compile > /tmp/backend-compile.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend compile diagnostics
        if: steps.backend-compile.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backend-compile-log
          path: /tmp/backend-compile.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when backend compilation failed
        if: steps.backend-compile.outputs.status != '0'
        run: exit 1

      - name: Compile backend tests
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests test-compile

      - name: Run unit and API tests
        id: backend-unit
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=DemoHomeServiceTest,HomeQueryFactoryTest,HomeServiceTest,HomeControllerTest,AdaptiveDailyGoalCalculatorTest,DailyGoalServiceTest,ActivitySyncCalculatorTest,ActivitySyncServiceTest,ActivitySyncControllerTest,ActivitySyncFingerprintTest,ActivityRetentionServiceTest,ActivityRiskEvaluatorTest,EconomyServiceTest,ExpeditionAdvanceFingerprintTest,ExpeditionAdvanceServiceTest,ExpeditionAdvanceControllerTest,ProgressionServiceTest,InventoryServiceTest,EventResolutionFingerprintTest,EventResolutionServiceTest,EventResolutionControllerTest,EventResultAcknowledgementControllerTest,CraftingServiceTest,CraftingControllerTest,EquipmentServiceTest,EquipmentControllerTest,PlatformContentCatalogTest,PlatformCommandFingerprintTest,PlatformServiceTest,PlatformProviderConfigurationTest,PlatformAdminServiceProviderTest,PlatformControllerTest,PlatformAdminControllerTest,JwtAuthorityConverterTest,SecurityContextRequestIdentityProviderTest,DevHeaderAuthenticationFilterTest,WalkingRpgSecurityPropertiesTest,SecurityModeGuardTest,ProductionRuntimeGuardTest,ProductionOperationsGuardTest,PostgresDrillManifestTest,PublicIngressPropertiesTest,PublicIngressRateLimiterTest,PublicIngressProtectionFilterTest,JdbcStatementTimeoutsTest,BoundedDataSourceHealthIndicatorTest,ActiveAccountFilterTest,DevHeaderSecurityIntegrationTest,JwtSecurityIntegrationTest \
            test > /tmp/backend-unit.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend unit diagnostics
        if: steps.backend-unit.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-log
          path: /tmp/backend-unit.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when backend unit tests failed
        if: steps.backend-unit.outputs.status != '0'
        run: exit 1

      - name: Run PostgreSQL integration and migration tests
        id: postgres-integration
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=ActivitySyncPersistenceIntegrationTest,HomeReadIntegrationTest,ExpeditionAdvanceIntegrationTest,EventResolutionIntegrationTest,CraftingIntegrationTest,EquipmentIntegrationTest,PlatformPersistenceIntegrationTest,AccountDeletionIntegrationTest,FirstJourneyAnalyticsIntegrationTest,CompassJourneyAnalyticsIntegrationTest,OperationalEndpointsIntegrationTest,SecondNodeInventoryMigrationTest,RoadmapPlatformMigrationTest,DurableActivitySyncFactMigrationTest,FirstJourneyObservabilityMigrationTest,DurableEventResultHandoffMigrationTest,ProductionProviderIsolationMigrationTest,ServerAuthoritativeCraftingMigrationTest,EquipmentAndResonanceRouteMigrationTest,ContentReleaseActivationHistoryMigrationTest,CosmeticSlotStateMigrationTest \
            test > /tmp/postgres-integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload PostgreSQL integration diagnostics
        if: steps.postgres-integration.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-log
          path: /tmp/postgres-integration.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when PostgreSQL integration tests failed
        if: steps.postgres-integration.outputs.status != '0'
        run: exit 1

  mobile:
    name: Mobile · Flutter 3.44.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze for diagnostics
        id: mobile-analyze
        shell: bash
        run: |
          set +e
          flutter analyze --fatal-infos > /tmp/mobile-analyze.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload mobile analyze diagnostics
        if: steps.mobile-analyze.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-analyze-log
          path: /tmp/mobile-analyze.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when mobile analysis failed
        if: steps.mobile-analyze.outputs.status != '0'
        run: exit 1

      - name: Run tests
        run: flutter test

  android-host:
    name: Android host · debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK for diagnostics
        id: android-build
        shell: bash
        run: |
          set +e
          flutter build apk --debug > /tmp/android-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Android build diagnostics
        if: steps.android-build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/android-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when Android build failed
        if: steps.android-build.outputs.status != '0'
        run: exit 1

  ios-host:
    name: iOS host · simulator debug
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator app for diagnostics
        id: ios-build
        shell: bash
        run: |
          set +e
          flutter build ios --simulator --debug > /tmp/ios-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload iOS build diagnostics
        if: steps.ios-build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/ios-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when iOS build failed
        if: steps.ios-build.outputs.status != '0'
        run: exit 1
