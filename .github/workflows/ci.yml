name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-structure:
    name: Project structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'

      - name: Install pinned action policy parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/action-pin-policy"
          "$RUNNER_TEMP/action-pin-policy/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r scripts/ci/action-pin-policy-requirements.txt
          echo "$RUNNER_TEMP/action-pin-policy/bin" >> "$GITHUB_PATH"

      - name: Test Auth0 identity contracts
        run: >-
          node --test
          auth0/actions/step-beyond-token-contract.test.js
          auth0/telegram/telegram-oidc-connection.test.js

      - name: Validate repository scaffold
        run: bash ./scripts/verify-project.sh

  backend:
    name: Backend · Java 21
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile backend
        id: backend-compile
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress -DskipTests compile > /tmp/backend-compile.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend compile diagnostics
        if: steps.backend-compile.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-compile-log
          path: /tmp/backend-compile.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when backend compilation failed
        if: steps.backend-compile.outputs.status != '0'
        run: exit 1

      - name: Compile backend tests
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests test-compile

      - name: Run unit and API tests
        id: backend-unit
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=DemoHomeServiceTest,HomeQueryFactoryTest,HomeServiceTest,HomeControllerTest,AdaptiveDailyGoalCalculatorTest,DailyGoalServiceTest,ActivitySyncCalculatorTest,ActivitySyncServiceTest,ActivitySyncControllerTest,ActivitySyncFingerprintTest,ActivityRetentionServiceTest,ActivityRiskEvaluatorTest,EconomyServiceTest,ExpeditionAdvanceFingerprintTest,ExpeditionAdvanceServiceTest,ExpeditionAdvanceControllerTest,ProgressionServiceTest,InventoryServiceTest,EventResolutionFingerprintTest,EventResolutionServiceTest,EventResultAcknowledgementServiceTest,EventResolutionControllerTest,EventResultAcknowledgementControllerTest,CraftingServiceTest,CraftingControllerTest,EquipmentServiceTest,EquipmentControllerTest,PlatformContentCatalogTest,PlatformCommandFingerprintTest,PlatformServiceTest,PlatformProviderConfigurationTest,PlatformAdminServiceTest,PlatformAdminServiceProviderTest,PlatformControllerTest,PlatformAdminControllerTest,JwtAuthorityConverterTest,SecurityContextRequestIdentityProviderTest,DevHeaderAuthenticationFilterTest,WalkingRpgSecurityPropertiesTest,SecurityModeGuardTest,ProductionRuntimeGuardTest,ProductionOperationsGuardTest,PostgresDrillManifestTest,PublicIngressPropertiesTest,PublicIngressRateLimiterTest,PublicIngressProtectionFilterTest,JdbcStatementTimeoutsTest,BoundedDataSourceHealthIndicatorTest,ActiveAccountFilterTest,DevHeaderSecurityIntegrationTest,JwtSecurityIntegrationTest \
            test > /tmp/backend-unit.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend unit diagnostics
        if: steps.backend-unit.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-unit-log
          path: /tmp/backend-unit.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when backend unit tests failed
        if: steps.backend-unit.outputs.status != '0'
        run: exit 1

      - name: Run PostgreSQL integration and migration tests
        id: postgres-integration
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -Dtest=ActivitySyncPersistenceIntegrationTest,HomeReadIntegrationTest,ExpeditionAdvanceIntegrationTest,EventResolutionIntegrationTest,CraftingIntegrationTest,EquipmentIntegrationTest,PlatformPersistenceIntegrationTest,AccountDeletionIntegrationTest,FirstJourneyAnalyticsIntegrationTest,CompassJourneyAnalyticsIntegrationTest,OperationalEndpointsIntegrationTest,SecondNodeInventoryMigrationTest,RoadmapPlatformMigrationTest,DurableActivitySyncFactMigrationTest,FirstJourneyObservabilityMigrationTest,DurableEventResultHandoffMigrationTest,ProductionProviderIsolationMigrationTest,ServerAuthoritativeCraftingMigrationTest,EquipmentAndResonanceRouteMigrationTest,ContentReleaseActivationHistoryMigrationTest,CosmeticSlotStateMigrationTest \
            test > /tmp/postgres-integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload PostgreSQL integration diagnostics
        if: steps.postgres-integration.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-integration-log
          path: /tmp/postgres-integration.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when PostgreSQL integration tests failed
        if: steps.postgres-integration.outputs.status != '0'
        run: exit 1

  mobile:
    name: Mobile · Flutter 3.44.7
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze for diagnostics
        id: mobile-analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --fatal-infos > /tmp/mobile-analyze.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload mobile analyze diagnostics
        if: steps.mobile-analyze.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-analyze-log
          path: /tmp/mobile-analyze.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when mobile analysis failed
        if: steps.mobile-analyze.outputs.status != '0'
        run: exit 1

      - name: Run tests
        run: flutter test --no-pub

  android-host:
    name: Android host · debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK for diagnostics
        id: android-build
        shell: bash
        run: |
          set +e
          flutter build apk --debug --no-pub > /tmp/android-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Android build diagnostics
        if: steps.android-build.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-log
          path: /tmp/android-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when Android build failed
        if: steps.android-build.outputs.status != '0'
        run: exit 1

  ios-host:
    name: iOS host · simulator debug
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install locked iOS pods
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          test "$(pod --version)" = '1.17.0'
          pod install --deployment
          git diff --exit-code -- Podfile.lock

      - name: Build iOS simulator app for diagnostics
        id: ios-build
        shell: bash
        run: |
          set +e
          flutter build ios --simulator --debug --no-pub > /tmp/ios-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify iOS pod lock unchanged
        shell: bash
        run: git diff --exit-code -- ios/Podfile.lock

      - name: Upload iOS build diagnostics
        if: steps.ios-build.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-log
          path: /tmp/ios-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when iOS build failed
        if: steps.ios-build.outputs.status != '0'
        run: exit 1
