name: Publish backend release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved 40-character commit SHA from master
        required: true
        type: string
      source_tree:
        description: Approved 40-character tree SHA from the release record
        required: true
        type: string

concurrency:
  group: publish-backend-release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: stage-release
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SOURCE_GIT_SHA: ${{ inputs.source_sha }}
      APPROVED_SOURCE_GIT_TREE: ${{ inputs.source_tree }}
      PROVENANCE_GUARD_BASELINE_SHA: 31027db88250e83112434db8cfcd85ed2b31fa8a
    steps:
      - name: Validate immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/master'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SOURCE_GIT_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROVENANCE_GUARD_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_GIT_SHA" != 0000000000000000000000000000000000000000
          test "$APPROVED_SOURCE_GIT_TREE" != 0000000000000000000000000000000000000000

      - name: Check out the approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify source against master and release record
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$SOURCE_GIT_SHA"
          test "$actual_tree" = "$APPROVED_SOURCE_GIT_TREE"
          git fetch --no-tags origin master
          test "$GITHUB_SHA" = "$(git rev-parse origin/master)"
          git cat-file -e "$PROVENANCE_GUARD_BASELINE_SHA^{commit}"
          git merge-base --is-ancestor \
            "$PROVENANCE_GUARD_BASELINE_SHA" "$SOURCE_GIT_SHA"
          git merge-base --is-ancestor "$SOURCE_GIT_SHA" origin/master
          grep -Fq \
            '> /usr/local/share/walking-rpg/source-git-sha' \
            backend/Dockerfile
          grep -Fq \
            'readonly IMAGE_PROVENANCE_DIRECTORY=/usr/local/share/walking-rpg' \
            backend/docker-entrypoint.sh
          grep -Fq \
            'container source Git SHA does not match the approved deployment SHA' \
            backend/docker-entrypoint.sh
          grep -Fq \
            'container source Git tree does not match the approved deployment tree' \
            backend/docker-entrypoint.sh
          printf 'source_sha=%s\n' "$actual_sha" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$actual_tree" >> "$GITHUB_OUTPUT"

      - name: Require successful integrated push workflows
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, head_sha: process.env.EXPECTED_SOURCE_SHA, per_page: 100},
            );
            const required = ['CI', 'Release quality'];
            for (const workflowName of required) {
              const successfulPush = runs.some((run) =>
                run.name === workflowName &&
                run.event === 'push' &&
                run.conclusion === 'success'
              );
              if (!successfulPush) {
                core.setFailed(
                  `${workflowName} has no successful push run for ` +
                    process.env.EXPECTED_SOURCE_SHA,
                );
              }
            }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install pinned action policy parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/action-pin-policy"
          "$RUNNER_TEMP/action-pin-policy/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r scripts/ci/action-pin-policy-requirements.txt
          echo "$RUNNER_TEMP/action-pin-policy/bin" >> "$GITHUB_PATH"

      - name: Verify repository release policy
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-readiness.sh
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APPROVED_SOURCE_GIT_TREE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Select fixed image repository
        id: image
        shell: bash
        run: echo 'name=ghcr.io/mksegr/walking-rpg-backend' >> "$GITHUB_OUTPUT"

      - name: Build and publish approved linux/amd64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.source.outputs.source_sha }}
          build-args: |
            SOURCE_GIT_SHA=${{ steps.source.outputs.source_sha }}
            SOURCE_GIT_TREE=${{ steps.source.outputs.source_tree }}

      - name: Verify published image provenance contract
        id: verify_image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERIFIED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERIFIED_SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_reference="$IMAGE_NAME@$IMAGE_DIGEST"
          inspection_directory="$(mktemp -d)"
          container_id=''
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$inspection_directory"
          }
          trap cleanup EXIT HUP INT TERM

          docker pull --platform linux/amd64 "$image_reference" >/dev/null
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "$image_reference")" = 'linux/amd64'
          test "$(docker image inspect --format '{{.Config.User}}' \
            "$image_reference")" = 'walkingrpg:walkingrpg'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' \
            "$image_reference")" = '["/usr/local/bin/walking-rpg-entrypoint"]'
          test "$(docker image inspect --format \
            '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$image_reference")" = "$VERIFIED_SOURCE_SHA"
          test "$(docker image inspect --format \
            '{{index .Config.Labels "game.stepbeyond.source-tree"}}' \
            "$image_reference")" = "$VERIFIED_SOURCE_TREE"

          container_id="$(docker create --platform linux/amd64 "$image_reference")"
          docker cp \
            "$container_id:/usr/local/share/walking-rpg/source-git-sha" \
            "$inspection_directory/source-git-sha"
          docker cp \
            "$container_id:/usr/local/share/walking-rpg/source-git-tree" \
            "$inspection_directory/source-git-tree"
          docker cp \
            "$container_id:/usr/local/bin/walking-rpg-entrypoint" \
            "$inspection_directory/walking-rpg-entrypoint"

          test "$(cat "$inspection_directory/source-git-sha")" = \
            "$VERIFIED_SOURCE_SHA"
          test "$(cat "$inspection_directory/source-git-tree")" = \
            "$VERIFIED_SOURCE_TREE"
          cmp -- \
            backend/docker-entrypoint.sh \
            "$inspection_directory/walking-rpg-entrypoint"
          grep -Fq \
            'container source Git SHA does not match the approved deployment SHA' \
            "$inspection_directory/walking-rpg-entrypoint"
          grep -Fq \
            'container source Git tree does not match the approved deployment tree' \
            "$inspection_directory/walking-rpg-entrypoint"
          test "$(docker run --rm --entrypoint /usr/bin/stat "$image_reference" \
            -c '%u:%g:%a' /usr/local/share/walking-rpg)" = '0:0:555'
          test "$(docker run --rm --entrypoint /usr/bin/stat "$image_reference" \
            -c '%u:%g:%a' /usr/local/share/walking-rpg/source-git-sha)" = \
            '0:0:444'
          test "$(docker run --rm --entrypoint /usr/bin/stat "$image_reference" \
            -c '%u:%g:%a' /usr/local/bin/walking-rpg-entrypoint)" = '0:0:555'
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify immutable digest and write redacted receipt
        id: receipt
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.verify_image.outputs.image_digest }}
          VERIFIED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERIFIED_SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          PROVENANCE_GUARD_BASELINE_SHA: ${{ env.PROVENANCE_GUARD_BASELINE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" >/dev/null
          install -d -m 700 build/release
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          receipt = {
              "schemaVersion": "walking-rpg-backend-image-receipt-v1",
              "sourceGitSha": os.environ["VERIFIED_SOURCE_SHA"],
              "sourceGitTree": os.environ["VERIFIED_SOURCE_TREE"],
              "provenanceGuardBaselineSha": os.environ[
                  "PROVENANCE_GUARD_BASELINE_SHA"
              ],
              "image": os.environ["IMAGE_NAME"],
              "digest": os.environ["IMAGE_DIGEST"],
              "platform": "linux/amd64",
              "workflowRun": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "publishedAt": datetime.datetime.now(datetime.UTC).isoformat().replace(
                  "+00:00", "Z"
              ),
          }
          path = Path("build/release/backend-image-receipt.json")
          path.write_text(
              json.dumps(receipt, ensure_ascii=True, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum build/release/backend-image-receipt.json \
            > build/release/backend-image-receipt.json.sha256
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload backend image receipt
        id: upload-receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image-receipt-${{ steps.source.outputs.source_sha }}
          path: |
            build/release/backend-image-receipt.json
            build/release/backend-image-receipt.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Summarize immutable release input
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.receipt.outputs.image_digest }}
          VERIFIED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERIFIED_SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          PROVENANCE_GUARD_BASELINE_SHA: ${{ env.PROVENANCE_GUARD_BASELINE_SHA }}
          RECEIPT_ARTIFACT_DIGEST: ${{ steps.upload-receipt.outputs.artifact-digest }}
        shell: bash
        run: |
          {
            printf '### Backend release candidate\n\n'
            printf -- '- Source commit: `%s`\n' "$VERIFIED_SOURCE_SHA"
            printf -- '- Source tree: `%s`\n' "$VERIFIED_SOURCE_TREE"
            printf -- '- Provenance guard baseline: `%s`\n' \
              "$PROVENANCE_GUARD_BASELINE_SHA"
            printf -- '- Image: `%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST"
            printf -- '- Receipt artifact digest: `%s`\n' "$RECEIPT_ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
