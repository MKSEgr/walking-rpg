name: Protected mobile signing attestation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Signed artifact platform
        required: true
        type: choice
        options: [android, ios]
      release_asset_id:
        description: Numeric ID of the private draft-release asset
        required: true
        type: string
      source_sha:
        description: Exact current master commit used to build the artifact
        required: true
        type: string
      certificate_fingerprint_sha256:
        description: Expected public signing-certificate SHA-256
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-24.04
    environment: protected-mobile-signing
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download and verify protected Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.release_asset_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_FINGERPRINT: ${{ inputs.certificate_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "$SOURCE_SHA"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > candidate.aab
          jarsigner -verify -strict candidate.aab
          ACTUAL_FINGERPRINT="$(keytool -printcert -jarfile candidate.aab | sed -nE 's/.*SHA256: ([0-9A-F:]+).*/\1/p' | tr -d ':' | tr 'A-F' 'a-f' | head -1)"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$BUNDLETOOL"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$BUNDLETOOL" | sha256sum --check --strict
          EXPECTED_APPLICATION_ID="$(sed -nE 's/.*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mobile/android/app/build.gradle.kts | sort -u)"
          read -r EXPECTED_VERSION EXPECTED_BUILD <<< "$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([^[:space:]]+)[[:space:]]*$/\1 \2/p' mobile/pubspec.yaml)"
          [[ "$EXPECTED_APPLICATION_ID" =~ ^[A-Za-z0-9._]+$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$EXPECTED_BUILD" =~ ^[1-9][0-9]{0,17}$ ]]
          ACTUAL_APPLICATION_ID="$(java -jar "$BUNDLETOOL" dump manifest --bundle=candidate.aab --xpath=/manifest/@package)"
          ACTUAL_VERSION="$(java -jar "$BUNDLETOOL" dump manifest --bundle=candidate.aab --xpath=/manifest/@android:versionName)"
          ACTUAL_BUILD="$(java -jar "$BUNDLETOOL" dump manifest --bundle=candidate.aab --xpath=/manifest/@android:versionCode)"
          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_BUILD" = "$EXPECTED_BUILD"
      - name: Attest verified Android artifact
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.1
        with:
          subject-path: candidate.aab
      - name: Retain offline attestation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  attest-ios:
    if: inputs.platform == 'ios'
    runs-on: macos-26
    environment: protected-mobile-signing
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download and verify protected iOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.release_asset_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_FINGERPRINT: ${{ inputs.certificate_fingerprint_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "$SOURCE_SHA"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > candidate.ipa
          unzip -q candidate.ipa -d ipa
          APPS=(ipa/Payload/*.app)
          test "${#APPS[@]}" -eq 1
          test -d "${APPS[0]}"
          codesign --verify --deep --strict "${APPS[0]}"
          codesign -d --extract-certificates=certificate "${APPS[0]}"
          ACTUAL_FINGERPRINT="$(openssl x509 -inform DER -in certificate0 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"
          EXPECTED_APPLICATION_ID="$(sed -nE 's/.*PRODUCT_BUNDLE_IDENTIFIER[[:space:]]*=[[:space:]]*([^;]+);.*/\1/p' mobile/ios/Runner.xcodeproj/project.pbxproj | grep -v '\.RunnerTests$' | sort -u)"
          read -r EXPECTED_VERSION EXPECTED_BUILD <<< "$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([^[:space:]]+)[[:space:]]*$/\1 \2/p' mobile/pubspec.yaml)"
          [[ "$EXPECTED_APPLICATION_ID" =~ ^[A-Za-z0-9._]+$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$EXPECTED_BUILD" =~ ^[1-9][0-9]{0,17}$ ]]
          INFO_PLIST="${APPS[0]}/Info.plist"
          ACTUAL_APPLICATION_ID="$(plutil -extract CFBundleIdentifier raw -o - "$INFO_PLIST")"
          ACTUAL_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$INFO_PLIST")"
          ACTUAL_BUILD="$(plutil -extract CFBundleVersion raw -o - "$INFO_PLIST")"
          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_BUILD" = "$EXPECTED_BUILD"
      - name: Attest verified iOS artifact
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.1
        with:
          subject-path: candidate.ipa
      - name: Retain offline attestation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
