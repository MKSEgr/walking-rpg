name: Protected mobile evidence attestation

on:
  workflow_dispatch:
    inputs:
      evidence_asset_id:
        description: Numeric ID of the sanitized signed-candidate evidence asset
        required: true
        type: string
      source_sha:
        description: Exact current master commit represented by the evidence
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-evidence:
    runs-on: ubuntu-24.04
    environment: protected-mobile-signing
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download and preflight sanitized candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.evidence_asset_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)" = "$SOURCE_SHA"
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            > signed-candidate-evidence.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          evidence = json.loads(
              Path("signed-candidate-evidence.json").read_bytes(),
              object_pairs_hook=unique,
          )
          if set(evidence) != {
              "schemaVersion", "recordStatus", "overallStatus", "recordedAtUtc",
              "source", "platforms", "cleanup", "approval",
          }:
              raise SystemExit("evidence has unexpected top-level keys")
          if evidence["schemaVersion"] != "walking-rpg-signed-candidate-v1":
              raise SystemExit("evidence schema is not approved")
          if evidence["recordStatus"] != "RECORDED" or evidence["overallStatus"] not in {"READY", "BLOCKED"}:
              raise SystemExit("only recorded candidate evidence can be attested")
          source = evidence.get("source")
          if not isinstance(source, dict) or source.get("repository") != os.environ["GITHUB_REPOSITORY"] or source.get("commitSha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("evidence source does not match this protected run")
          platforms = evidence.get("platforms")
          if not isinstance(platforms, list) or not any(
              isinstance(platform, dict) and platform.get("status") == "READY"
              for platform in platforms
          ):
              raise SystemExit("evidence contains no READY platform claim to authenticate")
          PY
      - name: Attest exact candidate evidence bytes
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.1
        with:
          subject-path: signed-candidate-evidence.json
      - name: Retain offline evidence attestation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-candidate-evidence-attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
