services:
  postgres:
    image: postgres:17-alpine
    container_name: walking-rpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walking_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-walking_rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walking_rpg_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - walking-rpg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-walking_rpg} -d ${POSTGRES_DB:-walking_rpg}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  walking-rpg-postgres-data:
