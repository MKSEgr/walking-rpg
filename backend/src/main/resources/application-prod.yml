walking-rpg:
  providers:
    payment: disabled
    push: disabled

  security:
    mode: jwt
    demo-endpoints-enabled: false
    device-claim: ${OIDC_DEVICE_CLAIM}
    authentication-time-claim: ${OIDC_AUTHENTICATION_TIME_CLAIM}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=verify-full
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
          audiences:
            - ${OIDC_AUDIENCE}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
