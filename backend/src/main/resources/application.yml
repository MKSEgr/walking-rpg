spring:
  application:
    name: walking-rpg-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:walking_rpg}
    username: ${POSTGRES_USER:walking_rpg}
    password: ${POSTGRES_PASSWORD:walking_rpg_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: walking-rpg-backend
    version: 0.1.0-SNAPSHOT
