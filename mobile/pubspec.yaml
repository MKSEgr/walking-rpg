name: walking_rpg_mobile
description: Flutter client for the Walking RPG project.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  crypto: 3.0.7
  flutter:
    sdk: flutter
  flutter_appauth: 12.0.2
  flutter_secure_storage: 10.3.1
  flutter_timezone: 5.1.0
  health: 13.3.1
  path_provider: 2.1.6
  permission_handler: 12.0.3
  share_plus: 12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
